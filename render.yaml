services:
  - type: web
    name: kpss-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SCAN_INTERVAL_MINUTES
        value: "60"
      - key: DAILY_NOTIFICATION_HOUR
        value: "11"
      - key: DAILY_NOTIFICATION_MINUTE
        value: "0"
      - key: SEND_IMMEDIATE_NOTIFICATIONS
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
